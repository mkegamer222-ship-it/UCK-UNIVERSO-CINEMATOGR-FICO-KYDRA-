<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kydra Launcher</title>
    <meta name="description" content="Kydra Launcher — instala, prepara e inicia builds do Horizon (Minecraft: Java Edition reescrito em Rust). Tema verde." />
    <meta name="theme-color" content="#070b09" />
    <link rel="icon" href="src/assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/views.css" />
  </head>
  <body>
    <!-- Abertura (wordmark enquanto as listas carregam) -->
    <div class="opening" id="opening" aria-hidden="true">
      <div class="opening__glow"></div>
      <img class="opening__mark" src="src/assets/logo.svg" alt="" />
      <div class="opening__word">Kydra</div>
      <div class="opening__sub">Instalando o horizonte…</div>
      <div class="opening__bar"><span></span></div>
    </div>

    <div class="app" id="app">
      <!-- Barra lateral -->
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/play" aria-label="Kydra — início">
          <img src="src/assets/logo.svg" alt="" class="brand__mark" />
          <span class="brand__word">Kydra</span>
        </a>

        <nav class="nav" id="nav" aria-label="Principal"></nav>

        <div class="sidebar__spacer"></div>

        <div class="sidebar__foot">
          <button class="account" id="accountBtn" type="button"></button>
          <div class="sidebar__meta">
            <span>Launcher 0.1.0</span>
            <span class="dot-sep"></span>
            <button class="linklike" id="themeBtn" type="button">Tema</button>
          </div>
        </div>
      </aside>

      <!-- Conteúdo -->
      <main class="main" id="main" tabindex="-1"></main>
    </div>

    <!-- Camadas globais -->
    <div class="console" id="console" hidden>
      <header class="console__head">
        <div class="console__title">
          <span class="pulse"></span>
          <span id="consoleTitle">Console</span>
        </div>
        <div class="console__actions">
          <button class="btn btn--ghost btn--sm" id="consoleCopy" type="button">Copiar</button>
          <button class="iconbtn" id="consoleClose" type="button" aria-label="Fechar console">✕</button>
        </div>
      </header>
      <pre class="console__body" id="consoleBody"></pre>
    </div>

    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <div class="modal-root" id="modalRoot" hidden></div>

    <script type="module" src="src/js/app.js"></script>
  </body>
</html>
